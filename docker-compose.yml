# BOTELLAPP - Local Development with PostgreSQL
# Run: docker compose up -d
# Then set: DATABASE_URL=postgresql://botellapp:botellapp@localhost:5432/botellapp

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: botellapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: botellapp
      POSTGRES_USER: botellapp
      POSTGRES_PASSWORD: botellapp
    ports:
      - "5432:5432"
    volumes:
      - botellapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botellapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: botellapp-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  botellapp_pgdata:
